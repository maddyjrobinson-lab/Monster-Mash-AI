<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monster Mash... with AI</title><style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{min-height:100vh;background-color:light-dark(#fff8f1,#17131a);color:light-dark(#241b24,#f7eef8);padding:28px 18px 48px}main{max-width:760px;margin:auto}h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1;margin:8px 0 12px}.intro{font-size:1.05rem;line-height:1.55;margin-bottom:24px}.card{background:light-dark(#fff,#211b24);border:1px solid light-dark(#e5d8df,#3d3342);border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 4px 16px rgba(0,0,0,.06)}h2{font-size:1.15rem;margin:0 0 14px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid light-dark(#ded2d9,#463a4c);border-radius:14px;cursor:pointer;background:light-dark(#fffafc,#261f2b);font-size:1rem}label:has(input:checked){border-color:light-dark(#7b3f86,#c38bce);background:light-dark(#f5eafa,#392b3d)}input{width:20px;height:20px;accent-color:#7b3f86}button{border:0;border-radius:16px;padding:15px 20px;font-weight:750;font-size:1rem;cursor:pointer}#make{width:100%;background:light-dark(#6e2778,#c98ad4);color:white;margin-top:8px}.result{display:none}.prompt{white-space:pre-wrap;background:light-dark(#f5eef5,#17131a);border-radius:14px;padding:16px;line-height:1.55;border:1px solid light-dark(#ded2d9,#403644)}.copy{background:light-dark(#241b24,#f5eef8);color:light-dark(#fff,#241b24);margin-top:12px;width:100%}.small{font-size:.9rem;opacity:.78}@media(max-width:520px){.options{grid-template-columns:1fr}#app{padding:20px 12px 40px}}</style></head><body><div id="app"><main><h1>🎃 Monster Mash... with AI</h1><p class="intro"><strong>Directions:</strong> Create a silly Halloween monster mash with an identity, house, pet, ride, job, and food. Pick your choices, copy the prompt, and plug it into ChatGPT to create your image!</p><div id="form"></div><button id="make">✨ Create My Monster Prompt!</button><section class="card result" id="result"><h2>🧟 Your Monster Mash Prompt</h2><div class="prompt" id="prompt"></div><button class="copy" id="copy">📋 Copy Prompt</button><p class="small" id="status"></p></section></main></div><script>const data=[['Identity',['Vampire','Witch','Werewolf','Ghost','Frankenstein’s Monster','Zombie']],['House',['Haunted Mansion','Abandoned Castle','Witch’s Cottage','Haunted Library','Creepy Treehouse','Underwater Crypt']],['Pet',['Three-headed Dog','Black Cat','Tiny Dragon','Bat','Skeleton Horse','Giant Spider']],['Ride',['Flying Broomstick','Hearse','Giant Bat','Haunted Carriage','Monster Truck','Floating Coffin']],['Job',['Ghost Hunter','Potion maker','Graveyard Keeper','Monster Librarian','Professional Werewolf','Haunted-House Tour Guide']],['Food',['Candy Corn','Eyeball Soup','Pumpkin Pie','Spider Cupcakes','Mystery Stew','Human-Shaped Gingerbread']]];const form=document.getElementById('form');data.forEach(([category,choices],i)=>{const card=document.createElement('section');card.className='card';card.innerHTML='<h2>Choose your '+category+':</h2><div class="options"></div>';const box=card.querySelector('.options');choices.forEach(choice=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='c'+i;input.value=choice;const span=document.createElement('span');span.textContent=choice;label.append(input,span);box.appendChild(label)});form.appendChild(card)});document.getElementById('make').onclick=()=>{const values=data.map((_,i)=>document.querySelector('input[name="c'+i+'"]:checked')?.value);if(values.some(v=>!v)){alert('Please choose one option from every category!');return}const [identity,house,pet,ride,job,food]=values;document.getElementById('prompt').textContent='Create a silly Halloween monster mash image. The main character is a '+identity+' who lives in a '+house+', has a '+pet+' as a pet, rides a '+ride+', works as a '+job+', and loves to eat '+food+'. Make the scene colorful, playful, spooky, and funny—not scary or gory. Include all six choices clearly in one imaginative Halloween scene.';document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('prompt').textContent);document.getElementById('status').textContent='Copied! Now paste it into ChatGPT to create your image.'}catch(e){document.getElementById('status').textContent='Select and copy the prompt above, then paste it into ChatGPT to create your image.'}};</script></body></html>
